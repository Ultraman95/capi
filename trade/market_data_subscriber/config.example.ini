# market_data_subscriber 配置文件
# 用法:./market_data_subscriber <config_path>(默认 ./config.ini)
# 行内 '#' 注释合法;key 与 value 用 '=' 分隔,前后空白会被 trim。
#
# ============================================================================
# 字段参考
# ============================================================================
# exchange         必填。ccapi 内置 28 个 ID,见下文「交易所与 symbol 命名」。
# symbol           必填。命名规则因交易所而异,见下文。ccapi **直接透传**给交易所,
#                  不做任何大小写或分隔符规整。
# field            必填。可选值:
#                    MARKET_DEPTH    买卖盘前 N 档(配合 market_depth_max)
#                    TRADE           成交流(每笔成交一个 tick)
#                    BBO             买一卖一(top of book)
#                    CANDLESTICK     K 线(默认 1 分钟,需配合 candlestick_interval_seconds,本工具暂未暴露)
# market_depth_max 可选,MARKET_DEPTH 才用,默认 5。具体 N 档与底层频道映射各家不同
#                  (例如 OKX <=5 走 books5,>5 走 books)。
# conflate_interval_milliseconds  可选,默认 0(逐 tick)。设 100+ 会让交易所
#                  按周期合并推送(节省带宽与处理量)。
#                  ★ OKX 普通账号 MARKET_DEPTH 必须设 100+,见后文坑列表。
# instrument_type  可选(默认空)。仅 Bybit、Bitget 衍生品需要。可选值:
#                    Bybit:    spot / linear / inverse / option
#                    Bitget:   SPOT / USDT-FUTURES / COIN-FUTURES / USDC-FUTURES
#                  ★ Bybit **必传**:WS URL 是 /v5/public/{instrument_type},空了订不到。
# duration_seconds 可选,默认 30。0 = 一直跑,Ctrl-C 退出。
#
# ============================================================================
# 交易所与 symbol 命名(按 28 个 exchange ID 分组,BTC 为例;季月日期用 260925)
# 格式:产品 → symbol  [需要的 instrument_type,缺省即不需要]
# ============================================================================
#
# == binance ==                              [无 instrument_type]
#    现货 → BTCUSDT
#
# == binance-us ==                           [无 instrument_type]
#    现货(美国合规) → BTCUSDT
#
# == binance-usds-futures ==                 [无 instrument_type]
#    USDT 线性永续 → BTCUSDT
#    USDC 线性永续 → BTCUSDC
#
# == binance-coin-futures ==                 [无 instrument_type]
#    币本位永续  → BTCUSD_PERP
#    币本位交割  → BTCUSD_260925
#
# == okx ==                                  [无 instrument_type,所有产品同一 ID,symbol 后缀区分]
#    现货         → BTC-USDT
#    USDT 永续    → BTC-USDT-SWAP
#    币本位永续   → BTC-USD-SWAP
#    USDT 交割    → BTC-USDT-260925
#    币本位交割   → BTC-USD-260925
#    期权         → BTC-USD-260925-100000-C
#
# == bybit ==                                ★ 必传 instrument_type
#    现货         → BTCUSDT      (instrument_type = spot)
#    USDT 永续    → BTCUSDT      (instrument_type = linear)
#    币本位永续   → BTCUSD       (instrument_type = inverse)
#    期权         → BTC-26SEP25-100000-C   (instrument_type = option)
#
# == bitget ==                               [无 instrument_type;只有现货]
#    现货 → BTCUSDT
#
# == bitget-futures ==                       ★ 必传 instrument_type
#    USDT 线性永续 → BTCUSDT     (instrument_type = USDT-FUTURES)
#    币本位永续    → BTCUSD      (instrument_type = COIN-FUTURES)
#    USDC 线性永续 → BTCUSDC     (instrument_type = USDC-FUTURES)
#
# == kucoin ==                               [无 instrument_type;只有现货]
#    现货 → BTC-USDT
#
# == kucoin-futures ==                       [无 instrument_type;品种由 symbol 后缀区分]
#    USDT 线性永续 → XBTUSDTM    (BTC=XBT;M 表示 margined)
#    币本位永续    → XBTUSDM     (注意没 T)
#
# == kraken ==                               [无 instrument_type;只有现货]
#    现货 → XBT/USDT             (BTC=XBT,slash 分隔)
#
# == kraken-futures ==                       [无 instrument_type;品种由 symbol 前缀区分]
#    反向永续 (USD 计价)  → PI_XBTUSD
#    线性永续 (multi-collateral) → PF_XBTUSD
#    反向交割              → FI_XBTUSD_260925
#    线性交割              → FF_XBTUSD_260925
#
# == huobi ==                                [无 instrument_type;只有现货]
#    现货 → btcusdt              (全小写)
#
# == huobi-usdt-swap ==                      [无 instrument_type]
#    USDT 线性永续 → BTC-USDT
#
# == huobi-coin-swap ==                      [无 instrument_type]
#    币本位永续 → BTC-USD
#
# == mexc ==                                 [无 instrument_type;只有现货]
#    现货 → BTCUSDT
#
# == mexc-futures ==                         [无 instrument_type]
#    USDT 线性永续 → BTC_USDT    (下划线)
#
# == gateio ==                               [无 instrument_type;只有现货]
#    现货 → BTC_USDT             (下划线)
#
# == gateio-perpetual-futures ==             [无 instrument_type]
#    USDT 线性永续 → BTC_USDT
#
# == deribit ==                              [无 instrument_type;品种由 symbol 后缀区分]
#    永续(USDC 结算)   → BTC-PERPETUAL
#    交割              → BTC-26SEP25
#    期权              → BTC-26SEP25-100000-C  (尾部 C=call / P=put)
#
# == bitmex ==                               [无 instrument_type;品种由 symbol 区分]
#    USDT 线性永续 → XBTUSDT
#    反向永续(USD) → XBTUSD
#    反向交割     → XBTU26      (季月代码:H=Mar M=Jun U=Sep Z=Dec)
#
# == bitfinex ==                             [无 instrument_type;品种靠 t 前缀 + 后缀]
#    现货         → tBTCUSD
#    线性永续(衍生) → tBTCF0:USTF0
#
# == coinbase ==                             [无 instrument_type;只有现货]
#    现货 → BTC-USD
#    (Coinbase Advanced Trade perp 暂未在 ccapi 单独建档)
#
# == gemini ==                               [无 instrument_type;只有现货]
#    现货 → BTCUSD
#    (Gemini 衍生品 GFO 暂未在 ccapi 单独建档)
#
# == bitstamp ==                             [无 instrument_type;只有现货]
#    现货 → btcusd               (小写)
#
# == ascendex ==                             [无 instrument_type;只有现货]
#    现货 → BTC/USDT             (slash)
#
# == bitmart ==                              [无 instrument_type;只有现货]
#    现货 → BTC_USDT             (下划线)
#
# == cryptocom ==                            [无 instrument_type;统一 API,所有产品同一 ID,symbol 区分]
#    现货         → BTC_USDT     (下划线;CCY_PAIR)
#    永续(USD 计价)→ BTCUSD-PERP  (PERPETUAL_SWAP)
#    交割         → BTCUSD-260529 (FUTURE,YYMMDD)
#
# 拿不准时:打开交易所网页/APP 的合约页,**直接复制那个 symbol 字符串**;
# 或在浏览器开发者工具的 Network 面板看 ws 订阅消息里 `instId` / `symbol`
# 字段的实际值 —— ccapi 是直接透传的,所见即所得。
#
# ============================================================================
# 各交易所已知坑
# ============================================================================
# - OKX MARKET_DEPTH 默认走 books50-l2-tbt(VIP4+ 才能订阅),普通账号会被
#   静默拒绝(没 STATUS 也没数据)。修复:conflate_interval_milliseconds = 100,
#   ccapi 自动切到公开的 books5 频道。TRADE / CANDLESTICK 不受限。
# - OKX 同一个 ID `okx`,现货 / 永续 / 交割 / 期权全靠 symbol 后缀区分。
# - Bybit 同一个 ID `bybit`,V5 unified 下 spot / linear / inverse / option 共用。
#   ★ 必须传 `instrument_type`(本工具 config 里的字段),否则 WS URL 路径
#   /v5/public/{instrument_type} 是空尾,完全订不到。symbol 字面量 spot 与
#   linear 巧合都是 `BTCUSDT`,但走的是不同 stream。
# - Bitget 衍生品(bitget-futures)需要 `instrument_type` ∈ USDT-FUTURES /
#   COIN-FUTURES / USDC-FUTURES。
# - KuCoin / KuCoin Futures 的 WS 是动态 URL:ccapi 先 POST
#   /api/v1/bullet-public 拿 token,再连 wss://ws-api-futures.kucoin.com/?token=...
#   整条流程 ~1.5 秒,duration_seconds 不要给得过短(>=5s 较稳妥)。
#   注:ccapi 上游 KuCoin prepareConnect 有"首次连接 plain TCP 而非 SSL"的 bug
#   (本仓已在 ccapi_market_data_service_kucoin_base.h 修复:setUrl 后重建 stream),
#   未修复版会卡 7 秒 RST + 重试才成功。
# - MEXC 现货旧端点 wbs.mexc.com 已被封,ccapi 已切到 wbs-api.mexc.com;
#   合约切到 wss://contract.mexc.com/edge(都已修复,直接使用)。
# - Coinbase 在 ccapi 中只覆盖现货,Advanced Trade 的 perp 暂未单独建档。
# - Kraken 现货里 BTC 写成 XBT(交易所自己的历史包袱)。
#
# ============================================================================
# 实际配置 —— 以下是默认跑的 subscription
# ============================================================================
exchange = binance-usds-futures
symbol   = HMSTRUSDT
field    = MARKET_DEPTH

market_depth_max = 5
conflate_interval_milliseconds = 0
duration_seconds = 30
